included:
  - Sources
  - Tests

disabled_rules:
  - trailing_whitespace
  - line_length
  - type_body_length
  - file_length
  - function_body_length

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - discouraged_object_literal
  - empty_string
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last

# Only flag `.count` on collections, not integer properties named `count`.
empty_count:
  only_after_dot: true

# One case per Dynamic Type size is a lookup table, not branching logic.
cyclomatic_complexity:
  ignores_case_statements: true

identifier_name:
  min_length: 2
  max_length: 50
  excluded:
    - id
    - x
    - y
    - z
    - i
    - j
    # color components
    - a
    - r
    - g
    - b

type_name:
  excluded:
    - UI

nesting:
  type_level: 3
  function_level: 3

reporter: xcode
